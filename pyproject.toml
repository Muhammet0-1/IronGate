[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irongate-lab"
version = "0.2.0"
description = "Localhost-only Modbus/TCP ICS process-security training lab"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammet0-1" }]
keywords = ["ics", "scada", "modbus", "simulation", "security-training"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Security",
]
dependencies = ["pymodbus>=3.11,<3.12"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
irongate-lab = "irongate_lab.cli:main"

[project.urls]
Homepage = "https://github.com/Muhammet0-1/IronGate"
Issues = "https://github.com/Muhammet0-1/IronGate/issues"
Repository = "https://github.com/Muhammet0-1/IronGate.git"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "irongate.py", "plc_sim.py"]
